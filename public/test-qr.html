<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lihyara QR Code Test Gallery</title>
  <style>
    :root {
      --ui-bg: #F1ECE0;
      --ui-panel: rgba(250, 247, 241, 0.95);
      --ui-panel-border: rgba(42, 36, 32, 0.08);
      --ui-primary: #1E5452;
      --ui-gold: #C9A227;
      --ui-text: #2A2420;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(135deg, #143d2b 0%, #6e4e08 25%, #661414 50%, #0d3259 75%, #143d2b 100%);
      background-attachment: fixed;
      color: #FBF8F2;
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      padding: 20px;
      background-image:
        radial-gradient(circle at top left, rgba(255,255,255,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.12), transparent 35%),
        linear-gradient(135deg, #143d2b 0%, #6e4e08 25%, #661414 50%, #0d3259 75%, #143d2b 100%);
    }

    h1 {
      font-family: serif;
      color: #FBF8F2;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    p { color: rgba(251, 248, 242, 0.9); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 16px; }
    .card {
      background: rgba(250, 247, 241, 0.96);
      border: 1px solid var(--ui-panel-border);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      color: var(--ui-text);
    }
    img { width: 130px; height: 130px; image-rendering: pixelated; margin: 0 auto; display: block; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-top: 6px; }
    .easy { background: #E2EEDB; color: #2E5A1C; }
    .average { background: #FEF3D6; color: #8C6208; }
    .difficult { background: #FCE8E2; color: #9C331B; }
    .btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 18px;
      background: rgba(30, 84, 82, 0.9);
      border: 1px solid rgba(255,255,255,0.18);
      color: white;
      border-radius: 99px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <a href="/" class="btn">← Back to App</a>
  <h1>Lihyara QR Codes Gallery (129 Cards)</h1>
  <p>Scan any QR code below using your phone camera or the web app scanner.</p>
  
  <div id="gallery" class="grid"></div>

  <script>
    fetch('/lihyara_all_cards.json')
      .then(res => res.json())
      .then(data => {
        const gallery = document.getElementById('gallery');
        data.cards.forEach(card => {
          const diffClass = card.difficulty === 1 ? 'easy' : (card.difficulty === 3 ? 'average' : 'difficult');
          const diffName = card.difficulty === 1 ? 'Easy' : (card.difficulty === 3 ? 'Average' : 'Difficult');
          const cardEl = document.createElement('div');
          cardEl.className = 'card';
          cardEl.innerHTML = `
            <img src="/qr_codes/${card.qrId}.png" alt="${card.qrId}" onerror="this.src='/favicon.svg'" />
            <div style="font-weight: bold; margin-top: 8px; font-family: monospace;">${card.qrId.toUpperCase()}</div>
            <div style="font-size: 11px; color: #8C8579;">Grade ${card.grade}</div>
            <span class="tag ${diffClass}">${diffName}</span>
          `;
          gallery.appendChild(cardEl);
        });
      });
  </script>
</body>
</html>
